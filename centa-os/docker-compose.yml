# 운영 배포 예시. 비밀값은 같은 폴더의 .env 로 주입한다 (저장소에 커밋 금지).
#   DB_PASSWORD, AUTH_SECRET (필수) / PUBLIC_DATA_KEY, ANTHROPIC_API_KEY (선택)
# ※ 이 파일은 개발 환경에서 도커를 실행할 수 없어 실제 구동 검증을 하지 못했습니다.
#    첫 배포 때 docs/OPERATIONS.md 의 점검표로 확인하세요.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: centa
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD 필요}"
      POSTGRES_DB: centa_os
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centa -d centa_os"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://centa:${DB_PASSWORD}@db:5432/centa_os
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET 필요}
      PUBLIC_DATA_KEY: ${PUBLIC_DATA_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]   # 외부에는 HTTPS 리버스 프록시(Caddy/Nginx)만 노출
    restart: unless-stopped
  backup:                             # 매일 DB 백업 → ./backups (오래된 파일 정리는 OPERATIONS.md 참고)
    image: postgres:16
    depends_on:
      db: { condition: service_healthy }
    environment: { PGPASSWORD: "${DB_PASSWORD}" }
    volumes: ["./backups:/backups"]
    entrypoint: ["/bin/sh", "-c", "while true; do pg_dump -h db -U centa centa_os | gzip > /backups/centa_$$(date +%Y%m%d_%H%M%S).sql.gz; sleep 86400; done"]
    restart: unless-stopped
volumes:
  pgdata: {}
